<form class="row g-2 my-3" method="get"><div class="col-md-4"><input class="form-control" name="q" value="{{ filters.q }}" placeholder="Search title or description"></div><div class="col-md-2"><select class="form-select" name="status"><option value="">All statuses</option>{% for value,label in incidents.model.STATUS_CHOICES %}<option value="{{ value }}" {% if filters.status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div><div class="col-md-2"><select class="form-select" name="priority"><option value="">All priorities</option>{% for value,label in incidents.model.PRIORITY_CHOICES %}<option value="{{ value }}" {% if filters.priority == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div><div class="col-md-2"><select class="form-select" name="category"><option value="">All categories</option>{% for category in categories %}<option value="{{ category.id }}" {% if filters.category == category.id|stringformat:'s' %}selected{% endif %}>{{ category }}</option>{% endfor %}</select></div><div class="col-md-2"><button class="btn btn-outline-primary w-100">Filter</button></div></form>
