{% extends "base.html" %}
{% block title %}Delete Incident{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger p-4 text-center">
            <h3 class="text-danger">🗑 Delete Incident</h3>
            <p class="mt-3">Are you sure you want to delete <strong>"{{ incident.title }}"</strong>?</p>
            <p class="text-muted">This action cannot be undone.</p>
            <div class="d-flex justify-content-center gap-3 mt-3">
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
                </form>
                <a href="{% url 'incident_detail' incident.pk %}" class="btn btn-outline-secondary px-4">Cancel</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
